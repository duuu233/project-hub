# 共享项目注册表：同名项目复用同一个 ID，路径由各环境独立配置。
version: 1
projects:
  flowerpot-app:
    name: 花盆APP
    description: 花盆移动应用
    context: context/flowerpot-app.md
    default_branch: main
    enabled: true
  flowerpot-admin:
    name: 花盆后台
    description: 花盆后台管理项目
    context: context/flowerpot-admin.md
    default_branch: main
    enabled: true
  album-admin:
    name: 相册后台
    description: 相册后台管理项目
    context: context/album-admin.md
    default_branch: main
    enabled: true
  album-miniapp:
    name: 相册小程序
    description: 相册小程序项目
    context: context/album-miniapp.md
    default_branch: main
    enabled: true
  album-app:
    name: 相册APP
    description: 相册移动应用
    context: context/album-app.md
    default_branch: main
    enabled: true
  minerals-admin:
    name: 正矿
    description: 正矿管理系统前端
    context: context/minerals-admin.md
    default_branch: master
    enabled: true
