function iconFor(text){const list=['⌂','审','贸','商','品','站','订','进','提','入','出','库','采','销','票','结','协','金','准','授','资','履','车','系'];let n=[...text].reduce((a,c)=>a+c.charCodeAt(0),0);return list[n%list.length]}

function injectBolQuickNav(root){
  if(root.querySelector('.bolQuickNav')) return;
  const card=root.querySelector('.bol52Card'); if(!card) return;
  const sections=[...card.querySelectorAll('.bol52Section')];
  if(!sections.length) return;
  const nav=document.createElement('div'); nav.className='bolQuickNav';
  sections.forEach((sec,i)=>{
    const titleEl=sec.querySelector('h3'); if(!titleEl) return;
    sec.id=sec.id||`bol-sec-${i}`;
    const btn=document.createElement('button'); btn.textContent=titleEl.textContent.replace(/\d+$/,'').trim();
    btn.onclick=()=>{sec.scrollIntoView({behavior:'smooth',block:'start'}); [...nav.querySelectorAll('button')].forEach(b=>b.classList.remove('active')); btn.classList.add('active')};
    nav.appendChild(btn);
  });
  const tabs=card.querySelector('.bol52Tabs');
  tabs&&tabs.insertAdjacentElement('afterend',nav);
}
function enhanceBolSections(root){
  root.querySelectorAll('.bol52Section').forEach((sec,idx)=>{
    if(sec.dataset.enhanced) return;
    sec.dataset.enhanced='1';
    const head=sec.querySelector('.bol52SectionTitle,.bol52FoldHead');
    if(!head) return;
    const children=[...sec.children];
    const body=document.createElement('div'); body.className='bol52SectionBody';
    let past=false; children.forEach(ch=>{ if(ch===head){ past=true; return; } if(past) body.appendChild(ch); });
    sec.appendChild(body);
    const collapse=document.createElement('button'); collapse.className='bolSectionCollapse'; collapse.innerHTML='⌃';
    collapse.onclick=(e)=>{e.stopPropagation(); sec.classList.toggle('is-collapsed');};
    head.appendChild(collapse);
  });
  root.querySelectorAll('.field').forEach(field=>{
    if(field.querySelector('.bolFieldHint')) return;
    const label=field.querySelector('label'); const control=field.querySelector('input,select,textarea');
    if(!label||!control) return;
    const hint=document.createElement('div'); hint.className='bolFieldHint';
    const txt=label.textContent;
    if(txt.includes('提单号')) {hint.classList.add('ok'); hint.textContent='建议与附件识别结果保持一致';}
    else if(txt.includes('日期')) {hint.textContent='支持后续与流程节点自动关联';}
    else if(txt.includes('金额')) {hint.classList.add('warn'); hint.textContent='金额将用于结算与后续风控校验';}
    else return;
    field.appendChild(hint);
  });
}

}

<script>
/* V5.10 附件卡片轻量规范，结构也同步压缩 */
function __bolUploadId(prefix){
  window.__bolUploadSeed = (window.__bolUploadSeed || 0) + 1;
  return prefix + '_' + window.__bolUploadSeed;
}
function toggleModeUpload(id){
  var el=document.getElementById(id); if(!el) return;
  var next=el.getAttribute('data-mode')==='ai'?'normal':'ai';
  setModeUpload(id,next);
}
function setModeUpload(id,mode){
  var el=document.getElementById(id); if(!el) return;
  el.setAttribute('data-mode',mode);
  var btn=el.querySelector('.bolModeSwitchBtn');
  if(btn){btn.innerHTML = mode==='ai' ? '切到普通' : '<span class="miniAi">Ai</span>切到AI';}
}
function bol52ModeUpload(id,label,mode){
  var isAi=(mode||'ai')==='ai';
  return `<div class="bolModeUploadWrap">
    <div class="bolModeUploadLabel"><span class="bol52Required">*</span><span>${label}</span></div>
    <div id="${id}" class="bolModeUploadCard" data-mode="${isAi?'ai':'normal'}">
      <button class="bolModeSwitchBtn" onclick="toggleModeUpload('${id}')">${isAi?'切到普通':'<span class="miniAi">Ai</span>切到AI'}</button>
      <span class="bolModeHelp">?</span>
      <div class="bolModePanel mode-ai">
        <div class="bolModeAiMark">Ai</div>
        <div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div>
        <div class="bolModeAiAction">AI智能识别与解析</div>
      </div>
      <div class="bolModePanel mode-normal">
        <div class="bolModeNormalIcon">⬆</div>
        <div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div>
        <div class="bolModeUploadSub">支持 PDF / JPG / PNG，单个文件不超过30M</div>
      </div>
    </div>
  </div>`;
}
function bol52SimpleUpload(label, required=false){
  return bol52ModeUpload(__bolUploadId('normalUpload'), label, 'normal');
}
</script>



<style>
/* 去除截图红框中的重复/说明性元素 */

<script>
/* Red-box cleanup: top chips, page说明文案, 业务口径标签, 顶部新增/留痕快照, 列表重复新增 */
(function(){
  function cleanRedBoxDom(){
    var scenario=document.querySelector('.topbar .scenario');
    if(scenario) scenario.remove();
    document.querySelectorAll('.titleBlock p').forEach(function(n){n.remove();});
    document.querySelectorAll('.pageMetaStrip .metaPill').forEach(function(n){
      if((n.textContent||'').indexOf('业务口径')>-1) n.remove();
    });
    document.querySelectorAll('.pageHeader .actions button').forEach(function(btn){
      var txt=(btn.textContent||'').trim();
      if(txt==='留痕快照'||txt==='新增'||txt==='新增提单') btn.remove();
    });
    document.querySelectorAll('.bol52AddBtn').forEach(function(btn){btn.remove();});
  }
  window.cleanRedBoxDom=cleanRedBoxDom;

  if(typeof header==='function'){
    header=function(p,desc,extra){
      extra=extra||'';
      extra=extra.replace(/<button[^>]*>\s*(新增提单|新增)\s*<\/button>/g,'');
      extra=extra.replace(/<button[^>]*留痕快照[^<]*<\/button>/g,'');
      return `<div class="pageHeader"><div class="titleBlock"><h2>${p.name}</h2></div><div class="actions">${extra}<button class="btn" onclick="toggleFilters()">高级筛选</button><button class="btn" onclick="toast('已导出当前页面数据')">导出</button></div></div><div class="pageMetaStrip"><span class="metaPill"><i class="dot"></i>当前场景 <b>${p.group}</b></span><span class="metaPill">数据更新 <b>14:32</b></span><span class="metaPill">链路健康 <b>91.7%</b></span></div>`;
    };
  }

  if(typeof bol52ListTable==='function'){
    var _bol52ListTableClean=bol52ListTable;
    bol52ListTable=function(){
      return _bol52ListTableClean().replace(/<button class="bol52AddBtn"[^>]*>新增<\/button>/g,'');
    };
  }

  if(typeof renderV5BOL==='function'){
    var _renderV5BOLClean=renderV5BOL;
    renderV5BOL=function(p){
      _renderV5BOLClean(p);
      setTimeout(cleanRedBoxDom,0);
    };
  }

  cleanRedBoxDom();
  if(typeof pageMap!=='undefined' && pageMap.bol){
    current='bol';
    if(Array.isArray(opened) && !opened.includes('bol')) opened.push('bol');
    var nameEl=document.getElementById('currentName');
    if(nameEl) nameEl.textContent='提单管理';
    if(typeof buildNav==='function') buildNav();
    if(typeof buildTabs==='function') buildTabs();
    if(typeof render==='function') render();
    setTimeout(cleanRedBoxDom,150);
  }
})();
</script>

    const paths={

      warehouse:'<path d="m3 10 9-6 9 6"/><path d="M5 9.5V21h14V9.5"/><path d="M8 13h8v8H8z"/>',
      settlement:'<rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 9h16"/><path d="M8 14h3"/><path d="M15 13v3"/><path d="M13.5 14.5h3"/>',
      finance:'<path d="M3 9h18"/><path d="m5 9 7-5 7 5"/><path d="M6 9v8M10 9v8M14 9v8M18 9v8"/><path d="M4 17h16M3 21h18"/>',
      data:'<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>',
      system:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.87 2.87-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06-2.87-2.87.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06L7.07 3.8l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06 2.87 2.87-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.35.7.6 1 .3.3.7.44 1.1.4h.1v4h-.1c-.4-.04-.8.1-1.1.4-.25.3-.46.63-.6 1Z"/>'

  function v3PageDomain(id){ return V3_DOMAIN_BY_PAGE[id] || 'workspace'; }
  function v3DomainMeta(key){ return V3_DOMAINS.find(d=>d.key===key) || V3_DOMAINS[0]; }
  function v3BadgeFor(id){
    if(id==='approval_task') return '<span class="v3NavBadge attn">42</span>';
    if(id==='bol') return '<span class="v3NavBadge primary">6</span>';
    return '';
  }
  function v3AddRecent(id){
    if(!id || !window.pageMap || !pageMap[id]) return;
    v3RecentPages=[id,...v3RecentPages.filter(x=>x!==id)].slice(0,7);
    try{localStorage.setItem('zk_v3_recent_pages',JSON.stringify(v3RecentPages));}catch(e){}
  }
  function v3RecentFor(domainKey){
    const same=v3RecentPages.filter(id=>v3PageDomain(id)===domainKey);
    const list=(domainKey==='workspace' ? v3RecentPages : same).filter(id=>window.pageMap&&pageMap[id]);
    return list.slice(0,3);
  }
  function v3BuildRail(){
    const root=document.getElementById('domainNav');
    if(!root) return;
    root.innerHTML='';
    V3_DOMAINS.forEach(d=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='v3DomainItem'+(d.key===v3ActiveDomain?' active':'');
      b.title=d.title;
      b.setAttribute('aria-label',d.title);
      b.onclick=()=>{v3ActiveDomain=d.key;v3BuildNav();};
      b.innerHTML=`<span class="v3DomainIcon">${v3Svg(d.key)}</span><span class="v3DomainLabel">${d.label}</span>`;
      root.appendChild(b);
    });
  }
  function v3AppendSection(nav,title,ids,opts={}){
    const valid=ids.filter(id=>window.pageMap&&pageMap[id]);
    if(!valid.length) return;
    const sec=document.createElement('div'); sec.className='v3Section';
    const h=document.createElement('div'); h.className='v3SectionTitle'; h.textContent=title; sec.appendChild(h);
    valid.forEach(id=>{
      const p=pageMap[id];
      const b=document.createElement('button'); b.type='button';
      b.className='v3NavItem'+(id===window.current?' active':'')+(opts.recent?' v3RecentItem':'');
      b.title=p.name;
      b.onclick=()=>window.openPage(id);
      b.innerHTML=`<span class="v3NavBullet">${opts.recent?'◷':(p.name||'?').slice(0,1)}</span><span class="v3NavText">${p.name}</span>${v3BadgeFor(id)}`;
      sec.appendChild(b);
    });
    nav.appendChild(sec);
  }
  function v3BuildNav(){
    const nav=document.getElementById('nav');
    const input=document.getElementById('navSearch');
    if(!nav || !input) return;
    const key=(input.value||'').trim().toLowerCase();
    nav.innerHTML='';
    v3BuildRail();
    const meta=v3DomainMeta(v3ActiveDomain);
    const title=document.getElementById('navDomainTitle');
    const count=document.getElementById('navDomainCount');
    if(title) title.textContent=key?'搜索结果':meta.title;
    const allDomainPages=meta.sections.flatMap(s=>s.pages).filter(id=>window.pageMap&&pageMap[id]);
    if(count) count.textContent=key?'⌕':allDomainPages.length;
    if(key){
      V3_DOMAINS.forEach(d=>{
        const matches=d.sections.flatMap(s=>s.pages).filter(id=>{
          const p=window.pageMap&&pageMap[id]; if(!p) return false;
          return p.name.toLowerCase().includes(key)||d.title.toLowerCase().includes(key)||d.label.toLowerCase().includes(key);
        });
        if(matches.length) v3AppendSection(nav,d.title,matches);
      });
      if(!nav.children.length) nav.innerHTML='<div class="v3SearchHint">没有找到匹配功能。可以尝试“提单 / 授信 / 开票 / 库存”等业务关键词。</div>';
      return;
    }
    const recent=v3RecentFor(v3ActiveDomain);
    if(recent.length) v3AppendSection(nav,'最近使用',recent,{recent:true});
    meta.sections.forEach(s=>v3AppendSection(nav,s.title,s.pages));
    const subtitle=document.createElement('div');
    subtitle.className='v3SearchHint';
    subtitle.textContent=meta.subtitle;
    nav.appendChild(subtitle);
  }
  function v3SyncCollapse(){
    const app=document.getElementById('appShell')||document.querySelector('.app');

    app.classList.toggle('navCollapsed',v3Collapsed);

    const btn=document.getElementById('v3RailCollapse');

  }
  window.toggleSidebar=function(force){
    v3Collapsed=typeof force==='boolean'?force:!v3Collapsed;
    try{localStorage.setItem('zk_v3_sidebar_collapsed',v3Collapsed?'1':'0');}catch(e){}

    if(typeof window.toast==='function') toast(v3Collapsed?'已切换为 80px 收起导航':'已展开双层业务导航');
  };
  const oldOpenPage=window.openPage;
  window.openPage=function(id,push=true){
    if(!window.pageMap || !pageMap[id]) return;
    v3ActiveDomain=v3PageDomain(id);
    v3AddRecent(id);
    window.current=id;
    if(push&&!window.opened.includes(id)){window.opened.push(id);if(window.opened.length>9)window.opened.splice(1,1)}
    const currentName=document.getElementById('currentName'); if(currentName) currentName.textContent=pageMap[id].name;
    v3BuildNav();
    if(typeof window.buildTabs==='function') buildTabs();
    if(typeof window.showLoading==='function') showLoading();
    setTimeout(()=>{ if(typeof window.render==='function') render(); },120);
  };
  window.buildNav=v3BuildNav;

  const input=document.getElementById('navSearch');
  if(input) input.oninput=v3BuildNav;
  if(window.current && window.pageMap && pageMap[current]){
    v3ActiveDomain=v3PageDomain(current);
    const cn=document.getElementById('currentName'); if(cn) cn.textContent=pageMap[current].name;
  }
  v3SyncCollapse();
  v3BuildNav();
  if(typeof window.buildTabs==='function') buildTabs();

  window.addEventListener('storage',e=>{
    if(e.key==='zk_v3_sidebar_collapsed'){v3Collapsed=e.newValue==='1';v3SyncCollapse();}
  });
})();

];
  const PAGE_DOMAIN={};
  HOVER_DOMAINS.forEach(d=>d.sections.forEach(s=>s.pages.forEach(id=>PAGE_DOMAIN[id]=d.key)));
  const rail=document.getElementById('domainNav');
  const panel=document.getElementById('v3Panel');
  const nav=document.getElementById('nav');
  const search=document.getElementById('navSearch');
  const domainTitle=document.getElementById('navDomainTitle');
  const domainCount=document.getElementById('navDomainCount');
  if(!rail||!panel||!nav) return;

  let openKey='';
  let closeTimer=0;

  function domainByKey(key){return HOVER_DOMAINS.find(d=>d.key===key)||HOVER_DOMAINS[0]}
  function currentDomainKey(){
    try{return PAGE_DOMAIN[typeof current!=='undefined'?current:'dashboard']||'workspace'}catch(e){return 'workspace'}
  }
  function badge(id){
    if(id==='approval_task') return '<span class="v3NavBadge attn">42</span>';
    if(id==='bol') return '<span class="v3NavBadge primary">6</span>';
    return '';
  }
  function recentFor(key){
    let recent=[];
    try{recent=JSON.parse(localStorage.getItem('zk_v3_recent_pages')||'[]')}catch(e){}
    return recent.filter(id=>PAGE_DOMAIN[id]===key && typeof pageMap!=='undefined' && pageMap[id]).slice(0,3);
  }
  function clearPreview(){rail.querySelectorAll('.flyoutPreview').forEach(x=>x.classList.remove('flyoutPreview'))}
  function markPreview(key){
    clearPreview();
    const buttons=[...rail.querySelectorAll('.v3DomainItem')];
    const index=HOVER_DOMAINS.findIndex(d=>d.key===key);
    if(index>=0&&buttons[index]) buttons[index].classList.add('flyoutPreview');
  }
  function makeSection(title,ids,recent=false){
    const valid=ids.filter(id=>typeof pageMap!=='undefined'&&pageMap[id]);
    if(!valid.length) return null;
    const sec=document.createElement('div');sec.className='v3Section';
    const h=document.createElement('div');h.className='v3SectionTitle';h.textContent=title;sec.appendChild(h);
    valid.forEach(id=>{
      const p=pageMap[id];
      const b=document.createElement('button');b.type='button';
      b.className='v3NavItem'+((typeof current!=='undefined'&&current===id)?' active':'')+(recent?' v3RecentItem':'');
      b.innerHTML=`<span class="v3NavBullet">${recent?'◷':p.name.slice(0,1)}</span><span class="v3NavText">${p.name}</span>${badge(id)}`;
      b.addEventListener('click',()=>{
        closeFlyout(true);
        if(typeof openPage==='function') openPage(id);
      });
      sec.appendChild(b);
    });
    return sec;
  }
  function renderDomain(key,keyword=''){
    openKey=key;
    const meta=domainByKey(key);
    if(domainTitle) domainTitle.textContent=keyword?'搜索结果':meta.title;
    const all=meta.sections.flatMap(s=>s.pages).filter(id=>typeof pageMap!=='undefined'&&pageMap[id]);
    if(domainCount) domainCount.textContent=keyword?'⌕':String(all.length);
    nav.innerHTML='';
    const q=(keyword||'').trim().toLowerCase();
    if(q){
      const matches=all.filter(id=>pageMap[id].name.toLowerCase().includes(q));
      const sec=makeSection(meta.title,matches,false);
      if(sec) nav.appendChild(sec); else nav.innerHTML='<div class="v3SearchHint">当前业务域没有匹配功能。</div>';
      return;
    }
    const recent=recentFor(key);
    if(recent.length){const sec=makeSection('最近使用',recent,true);if(sec)nav.appendChild(sec)}
    meta.sections.forEach(s=>{const sec=makeSection(s.title,s.pages,false);if(sec)nav.appendChild(sec)});
    const hint=document.createElement('div');hint.className='v3SearchHint';hint.textContent=meta.subtitle;nav.appendChild(hint);
  }
  function openFlyout(key){
    clearTimeout(closeTimer);
    renderDomain(key,search?search.value:'');
    markPreview(key);
    panel.classList.add('isFlyoutOpen');
    panel.setAttribute('aria-hidden','false');
  }
  function closeFlyout(immediate=false){
    clearTimeout(closeTimer);
    const doClose=()=>{
      panel.classList.remove('isFlyoutOpen');
      panel.setAttribute('aria-hidden','true');
      clearPreview();
      openKey='';
      if(search) search.value='';
    };
    if(immediate) doClose(); else closeTimer=setTimeout(doClose,180);
  }
  function cancelClose(){clearTimeout(closeTimer)}
  function domainFromButton(btn){
    const buttons=[...rail.querySelectorAll('.v3DomainItem')];
    const idx=buttons.indexOf(btn);
    return HOVER_DOMAINS[idx]||null;
  }

  rail.addEventListener('pointerover',e=>{
    const btn=e.target.closest('.v3DomainItem');
    if(!btn||!rail.contains(btn)) return;
    if(e.relatedTarget&&btn.contains(e.relatedTarget)) return;
    const d=domainFromButton(btn);if(d)openFlyout(d.key);
  });
  rail.addEventListener('pointerleave',e=>{
    if(panel.contains(e.relatedTarget)) return;
    closeFlyout(false);
  });
  rail.addEventListener('focusin',e=>{
    const btn=e.target.closest('.v3DomainItem');const d=btn&&domainFromButton(btn);if(d)openFlyout(d.key);
  });
  panel.addEventListener('pointerenter',cancelClose);
  panel.addEventListener('pointerleave',e=>{
    if(rail.contains(e.relatedTarget)) return;
    closeFlyout(false);
  });
  panel.addEventListener('focusin',cancelClose);
  panel.addEventListener('focusout',e=>{
    if(panel.contains(e.relatedTarget)||rail.contains(e.relatedTarget)) return;
    closeFlyout(false);
  });
  if(search){
    search.oninput=function(){renderDomain(openKey||currentDomainKey(),search.value)};
    search.addEventListener('focus',()=>openFlyout(openKey||currentDomainKey()));
  }

  /* 顶部菜单按钮改为“唤起当前业务域悬浮层”，不再改变内容区宽度 */
  window.toggleSidebar=function(force){
    const shouldOpen=typeof force==='boolean'?force:!panel.classList.contains('isFlyoutOpen');
    if(shouldOpen) openFlyout(currentDomainKey()); else closeFlyout(true);
  };

  /* 强制当前版本始终只占 80px，不读取旧版固定展开状态 */
  const app=document.getElementById('appShell')||document.querySelector('.app');
  if(app) app.classList.add('navCollapsed');
  document.documentElement.style.setProperty('--sidebar-current','80px');
  try{localStorage.setItem('zk_v3_sidebar_collapsed','1')}catch(e){}
  panel.classList.remove('isFlyoutOpen');
  panel.setAttribute('aria-hidden','true');
})();
</script>

    ['approval_task','approval_template','approval_log'].forEach(id=>{if(typeof pageMap!=='undefined'&&pageMap[id]&&!seen.has(id)){seen.add(id);out.push(pageMap[id])}});

})();

<script>
(function(){
  window.bolAttachState = window.bolAttachState || {
    packing_bl:[{name:'提单 2.pdf', size:'1.8MB'}],
    bill_bl:[{name:'提单 2.pdf', size:'2.1MB'}],
    invoice:[{name:'提单发票 2.pdf', size:'1.2MB'}],
    weight_analysis:[],
    composition_analysis:[],
    other_attach:[]
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(m){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];});
  }
  window.__escapeHtml = escapeHtml;

  window.__formatAttachSize = function(size){
    if(!size || isNaN(size)) return '本地文件';
    var mb = size/1024/1024;
    if(mb >= 1) return mb.toFixed(1).replace(/\.0$/,'') + 'MB';
    var kb = size/1024;
    return Math.max(1, Math.round(kb)) + 'KB';
  };

  window.triggerBolUpload = function(key, single){
    var input = document.createElement('input');
    input.type='file';
    input.accept='.pdf,.jpg,.jpeg,.png';
    input.multiple = !single;
    input.onchange = function(){
      if(!input.files || !input.files.length) return;
      addBolUploadFiles(key, Array.from(input.files), !!single);
    };
    input.click();
  };

  window.addBolUploadFiles = function(key, files, single){
    var state = window.bolAttachState = window.bolAttachState || {};
    if(!state[key]) state[key] = [];
    var list = single ? [] : state[key].slice();
    files.forEach(function(file){
      if(list.length < 5){
        list.push({name:file.name, size:window.__formatAttachSize(file.size), status:'success'});
      }
    });
    state[key] = list;
    renderBolUploadList(key, !!single);
    if(typeof toast === 'function') toast(single ? '附件已更新' : '附件上传成功');
  };

  window.removeBolUpload = function(key, index, single){
    var state = window.bolAttachState = window.bolAttachState || {};
    if(!state[key]) return;
    state[key].splice(index,1);
    renderBolUploadList(key, !!single);
    if(typeof toast === 'function') toast('已删除附件');
  };

  window.renderBolUploadList = function(key, single){
    var host = document.getElementById('attach-list-' + key);
    if(!host) return;
    var files = (window.bolAttachState && window.bolAttachState[key]) || [];
    host.innerHTML = files.length ? files.map(function(file, idx){
      return '<div class="bol52FileBar bol52FileBar--interactive"><div class="left"><span class="fileIcon">📄</span><div class="meta"><span class="name">' + escapeHtml(file.name) + '</span><span class="sub">' + escapeHtml(file.size || '本地文件') + ' · 已上传</span></div></div><div class="right"><span class="ok">成功</span><button class="bolFileReplaceBtn" onclick="event.stopPropagation();triggerBolUpload(\'' + key + '\',' + (single?'true':'false') + ')">重新上传</button><button class="bolFileDeleteBtn" onclick="event.stopPropagation();removeBolUpload(\'' + key + '\',' + idx + ',' + (single?'true':'false') + ')">×</button></div></div>';
    }).join('') : '<div class="bolAttachEmptyBar">暂无已上传附件</div>';
  };

  window.attachDragOver = function(el, evt){evt.preventDefault();el.classList.add('dragging');};
  window.attachDragLeave = function(el){el.classList.remove('dragging');};
  window.attachDrop = function(el, evt, key, single){
    evt.preventDefault();
    el.classList.remove('dragging');
    var files = evt.dataTransfer && evt.dataTransfer.files ? Array.from(evt.dataTransfer.files) : [];
    if(files.length) addBolUploadFiles(key, files, !!single);
  };

  window.bol52InteractiveFileSlot = function(label,key,required,single){
    var files = (window.bolAttachState && window.bolAttachState[key]) || [];
    return `
      <div class="bolAttachGroup">
        <div class="bolAttachHeader">
          <span class="bol52UploadLabel">${required?'<span class="bol52Required">*</span>':''}${label}</span>
          <div class="bolAttachActions">
            <button class="bolMiniGhostBtn" onclick="triggerBolUpload('${key}',${single?'true':'false'})">${files.length?'重新上传':'上传附件'}</button>
          </div>
        </div>
        <div id="attach-list-${key}" class="bolAttachList"></div>
      </div>`;
  };

  window.bol52InteractiveModeUpload = function(label,key,mode,required){
    var isAi = (mode || 'normal') === 'ai';
    return `
      <div class="bolModeUploadWrap">
        <div class="bolAttachHeader">
          <div class="bolModeUploadLabel"><span class="bol52Required">${required?'*':''}</span><span>${label}</span></div>
          <div class="bolAttachActions">
            <button class="bolMiniGhostBtn" onclick="triggerBolUpload('${key}',false)">继续上传</button>
          </div>
        </div>
        <div id="attach-card-${key}" class="bolModeUploadCard clickable" data-mode="${isAi?'ai':'normal'}" onclick="triggerBolUpload('${key}',false)" ondragover="attachDragOver(this,event)" ondragleave="attachDragLeave(this)" ondrop="attachDrop(this,event,'${key}',false)">
          <button class="bolModeSwitchBtn" onclick="event.stopPropagation();toggleModeUpload('attach-card-${key}')">${isAi?'切到普通':'<span class="miniAi">Ai</span>切到AI'}</button>
          <span class="bolModeHelp">?</span>
          <div class="bolModePanel mode-ai">
            <div class="bolModeAiMark">Ai</div>
            <div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div>
            <div class="bolModeAiAction">AI智能识别与解析</div>
          </div>
          <div class="bolModePanel mode-normal">
            <div class="bolModeNormalIcon">⬆</div>
            <div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div>
            <div class="bolModeUploadSub">支持 PDF / JPG / PNG，单个文件不超过30M</div>
          </div>
        </div>
        <div class="bolModeUploadFooter"><span class="tips">支持拖拽上传，可删除已上传附件并重新上传</span></div>
        <div id="attach-list-${key}" class="bolAttachList"></div>
      </div>`;
  };

  var oldToggle = window.toggleModeUpload;
  window.toggleModeUpload = function(id){
    var el=document.getElementById(id);
    if(!el){ if(typeof oldToggle==='function') oldToggle(id); return; }
    var next=el.getAttribute('data-mode')==='ai'?'normal':'ai';
    el.setAttribute('data-mode', next);
    var btn=el.querySelector('.bolModeSwitchBtn');
    if(btn){btn.innerHTML = next==='ai' ? '切到普通' : '<span class="miniAi">Ai</span>切到AI';}
  };

  window.bol52BasePage = function(){
    document.getElementById('content').innerHTML=`<div class="bol52Wrap"><div class="bol52Card">${bol52Tabs('base')}<div class="bol52Section"><div class="bol52SectionTitle"><h3>进口采购订单信息</h3></div><div class="bol52FormGrid bolImportGrid"><div class="field"><label><span class="bol52Required">*</span>采购订单</label><select><option>1048475250655416320</option></select></div><div class="field"><label>合同号</label><input value="自动带出" class="bol52Readonly" /></div><div class="field"><label>代理客户名称</label><input value="自动带出" class="bol52Readonly" /></div><div class="field"><label>进口商</label><input value="自动带出" class="bol52Readonly" /></div><div class="field bolSpan2"><label>出口商/供应商</label><textarea>自动带出</textarea></div></div></div><div class="bol52Section"><div class="bol52SectionTitle"><h3>提单信息</h3><div class="bol52RightInline"><span>换单状态</span><span class="bol52Switch"><i></i>否</span></div></div><div class="bol52FormGrid"><div class="field"><label>提单号</label><input value="266801019" /></div><div class="field"><label><span class="bol52Required">*</span>提单类型</label><select><option>电放提单</option></select></div><div class="field"><label>提单发票号</label><input value="JM-ZK20260116-5" /></div><div class="field"><label><span class="bol52Required">*</span>提单发票金额</label><div class="bol52MoneyWrap"><select><option>$</option></select><input value="284484.65" /></div></div><div class="field"><label><span class="bol52Required">*</span>船公司</label><select><option>MAERSK</option></select></div><div class="field"><label><span class="bol52Required">*</span>货运方式</label><div class="bolShipMode"><div class="modeOption active"><span class="radio"></span><span>集装箱</span></div><div class="modeOption"><span class="radio"></span><span>散货船</span></div></div></div></div></div><div class="bol52Section"><div class="bol52SectionTitle"><h3>提单附件（文件上传数量最多支持为5个,且每个文件大小不超过30M）</h3></div><div class="bol52UploadRow bol52UploadRow--fit">${bol52InteractiveFileSlot('装箱单 BL','packing_bl',true,true)}${bol52InteractiveFileSlot('提单 BL','bill_bl',true,true)}${bol52InteractiveModeUpload('提单发票','invoice','ai',true)}${bol52InteractiveModeUpload('国外重量分析','weight_analysis','normal',true)}${bol52InteractiveModeUpload('国外成分分析','composition_analysis','normal',true)}${bol52InteractiveModeUpload('提单其他附件','other_attach','normal',true)}</div></div>${bol52FixedBar()}</div></div>`;
    ['packing_bl','bill_bl','invoice','weight_analysis','composition_analysis','other_attach'].forEach(function(key){
      renderBolUploadList(key, key==='packing_bl' || key==='bill_bl');
    });
  };

  function rerenderIfBase(){
    try{
      if(window.current==='bol' && window.bolMode==='base' && document.getElementById('content')){
        bol52BasePage();
      }
    }catch(e){}
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){setTimeout(rerenderIfBase,80);});
  }else{
    setTimeout(rerenderIfBase,80);
  }
})();
</script>


<style id="attach-final-logic-v3">
/* 最终附件交互逻辑：上传框始终保留，所有附件均支持多文件追加 */

<script id="attach-final-logic-v3-script">
(function(){
  window.bolAttachState={
    packing_bl:[{name:'提单 2.pdf',size:'1.8MB'}],
    bill_bl:[{name:'提单 2.pdf',size:'2.1MB'}],
    invoice:[{name:'提单发票 2.pdf',size:'1.2MB'}],
    weight_analysis:[],
    composition_analysis:[],
    other_attach:[]
  };
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];});}
  function sizeText(size){if(!size||isNaN(size))return '本地文件';var mb=size/1024/1024;return mb>=1?mb.toFixed(1).replace(/\.0$/,'')+'MB':Math.max(1,Math.round(size/1024))+'KB';}
  window.triggerBolUpload=function(key){
    var input=document.createElement('input');input.type='file';input.accept='.pdf,.jpg,.jpeg,.png';input.multiple=true;
    input.onchange=function(){if(input.files&&input.files.length)addBolUploadFiles(key,Array.from(input.files));};input.click();
  };
  window.addBolUploadFiles=function(key,files){
    var state=window.bolAttachState;state[key]=state[key]||[];
    files.forEach(function(file){if(state[key].length<5)state[key].push({name:file.name,size:sizeText(file.size)});});
    renderBolUploadList(key);if(typeof toast==='function')toast('附件上传成功');
  };
  window.removeBolUpload=function(key,index){
    var state=window.bolAttachState;if(!state[key])return;state[key].splice(index,1);renderBolUploadList(key);if(typeof toast==='function')toast('已删除附件');
  };
  window.renderBolUploadList=function(key){
    var host=document.getElementById('attach-list-'+key);if(!host)return;var files=(window.bolAttachState&&window.bolAttachState[key])||[];
    host.innerHTML=files.map(function(file,idx){return '<div class="bol52FileBar bol52FileBar--interactive"><div class="left"><span class="fileIcon">📄</span><div class="meta"><span class="name">'+esc(file.name)+'</span><span class="sub">'+esc(file.size)+' · 已上传</span></div></div><div class="right"><span class="ok">成功</span><button class="bolFileDeleteBtn" onclick="event.stopPropagation();removeBolUpload(\''+key+'\','+idx+')">×</button></div></div>';}).join('');
  };
  window.attachDragOver=function(el,e){e.preventDefault();el.classList.add('dragging');};
  window.attachDragLeave=function(el){el.classList.remove('dragging');};
  window.attachDrop=function(el,e,key){e.preventDefault();el.classList.remove('dragging');var files=e.dataTransfer&&e.dataTransfer.files?Array.from(e.dataTransfer.files):[];if(files.length)addBolUploadFiles(key,files);};
  window.toggleModeUpload=function(id){var el=document.getElementById(id);if(!el)return;var next=el.getAttribute('data-mode')==='ai'?'normal':'ai';el.setAttribute('data-mode',next);var btn=el.querySelector('.bolModeSwitchBtn');if(btn)btn.innerHTML=next==='ai'?'切到普通':'<span class="miniAi">Ai</span>切到AI';};
  window.bol52PersistentUpload=function(label,key,mode,required){
    var isAi=(mode||'normal')==='ai';
    return '<div class="bolModeUploadWrap"><div class="bolAttachHeader"><div class="bolModeUploadLabel">'+(required?'<span class="bol52Required">*</span>':'')+'<span>'+label+'</span></div></div><div id="attach-card-'+key+'" class="bolModeUploadCard clickable" data-mode="'+(isAi?'ai':'normal')+'" onclick="triggerBolUpload(\''+key+'\')" ondragover="attachDragOver(this,event)" ondragleave="attachDragLeave(this)" ondrop="attachDrop(this,event,\''+key+'\')"><button class="bolModeSwitchBtn" onclick="event.stopPropagation();toggleModeUpload(\'attach-card-'+key+'\')">'+(isAi?'切到普通':'<span class="miniAi">Ai</span>切到AI')+'</button><span class="bolModeHelp">?</span><div class="bolModePanel mode-ai"><div class="bolModeAiMark">Ai</div><div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div><div class="bolModeAiAction">AI智能识别与解析</div></div><div class="bolModePanel mode-normal"><div class="bolModeNormalIcon">⬆</div><div class="bolModeUploadText">将文件拖放到此处或<span>单击上传</span></div><div class="bolModeUploadSub">支持 PDF / JPG / PNG，单个文件不超过30M</div></div></div><div id="attach-list-'+key+'" class="bolAttachList"></div></div>';
  };
  window.bol52BasePage=function(){
    document.getElementById('content').innerHTML=`<div class="bol52Wrap"><div class="bol52Card">${bol52Tabs('base')}<div class="bol52Section"><div class="bol52SectionTitle"><h3>进口采购订单信息</h3></div><div class="bol52FormGrid bolImportGrid"><div class="field"><label><span class="bol52Required">*</span>采购订单</label><select><option>1048475250655416320</option></select></div><div class="field"><label>合同号</label><input value="自动带出" class="bol52Readonly" /></div><div class="field"><label>代理客户名称</label><input value="自动带出" class="bol52Readonly" /></div><div class="field"><label>进口商</label><input value="自动带出" class="bol52Readonly" /></div><div class="field bolSpan2"><label>出口商/供应商</label><textarea>自动带出</textarea></div></div></div><div class="bol52Section"><div class="bol52SectionTitle"><h3>提单信息</h3><div class="bol52RightInline"><span>换单状态</span><span class="bol52Switch"><i></i>否</span></div></div><div class="bol52FormGrid"><div class="field"><label>提单号</label><input value="266801019" /></div><div class="field"><label><span class="bol52Required">*</span>提单类型</label><select><option>电放提单</option></select></div><div class="field"><label>提单发票号</label><input value="JM-ZK20260116-5" /></div><div class="field"><label><span class="bol52Required">*</span>提单发票金额</label><div class="bol52MoneyWrap"><select><option>$</option></select><input value="284484.65" /></div></div><div class="field"><label><span class="bol52Required">*</span>船公司</label><select><option>MAERSK</option></select></div><div class="field"><label><span class="bol52Required">*</span>货运方式</label><div class="bolShipMode"><div class="modeOption active"><span class="radio"></span><span>集装箱</span></div><div class="modeOption"><span class="radio"></span><span>散货船</span></div></div></div></div></div><div class="bol52Section"><div class="bol52SectionTitle"><h3>提单附件（文件上传数量最多支持为5个,且每个文件大小不超过30M）</h3></div><div class="bol52UploadRow bol52UploadRow--fit">${bol52PersistentUpload('装箱单 BL','packing_bl','normal',true)}${bol52PersistentUpload('提单 BL','bill_bl','normal',true)}${bol52PersistentUpload('提单发票','invoice','ai',true)}${bol52PersistentUpload('国外重量分析','weight_analysis','normal',true)}${bol52PersistentUpload('国外成分分析','composition_analysis','normal',true)}${bol52PersistentUpload('提单其他附件','other_attach','normal',true)}</div></div>${bol52FixedBar()}</div></div>`;
    ['packing_bl','bill_bl','invoice','weight_analysis','composition_analysis','other_attach'].forEach(renderBolUploadList);
  };
  function refreshBase(){try{if(window.current==='bol'&&window.bolMode==='base'&&document.getElementById('content'))bol52BasePage();}catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(refreshBase,120);});else setTimeout(refreshBase,120);
})();
</script>

      const h=document.createElement('div');h.className='v34SectionTitle';h.textContent=sec.title;wrap.appendChild(h);
      const list=document.createElement('div');list.className='v34ItemList';wrap.appendChild(list);
      (sec.items||[]).forEach(id=>{const el=makeItem(id,false);if(el)list.appendChild(el)});
      (sec.cross||[]).forEach(id=>{const el=makeItem(id,true);if(el)list.appendChild(el)});
      if(!list.children.length){const e=document.createElement('div');e.className='v34Empty';e.textContent='暂无入口';list.appendChild(e)}
      grid.appendChild(wrap);
    });
    renderRecent(key);pin.classList.toggle('on',lockedKey===key);syncRail();
  }
  function showMega(key){clearTimeout(closeTimer);renderDomain(key);mega.classList.add('open');mega.setAttribute('aria-hidden','false')}
  function hideMega(immediate=false){
    clearTimeout(closeTimer);
    const close=()=>{if(lockedKey)return;mega.classList.remove('open');mega.setAttribute('aria-hidden','true');shownKey='';syncRail()};
    if(immediate)close();else closeTimer=setTimeout(close,220);
  }
  function cancelClose(){clearTimeout(closeTimer)}
  function toggleLock(key){
    lockedKey=lockedKey===key?'':key;
    if(lockedKey) showMega(key); else hideMega(true);
    pin.classList.toggle('on',!!lockedKey);syncRail();
  }

  rail.addEventListener('pointerover',e=>{const btn=e.target.closest('.v3DomainItem');if(!btn||!rail.contains(btn))return;if(e.relatedTarget&&btn.contains(e.relatedTarget))return;showMega(btn.dataset.key)});
  rail.addEventListener('pointerleave',e=>{if(mega.contains(e.relatedTarget))return;clearTimeout(closeTimer);if(lockedKey&&shownKey!==lockedKey){closeTimer=setTimeout(()=>showMega(lockedKey),220)}else if(!lockedKey){hideMega(false)}});
  rail.addEventListener('click',e=>{const btn=e.target.closest('.v3DomainItem');if(!btn)return;toggleLock(btn.dataset.key)});
  rail.addEventListener('focusin',e=>{const btn=e.target.closest('.v3DomainItem');if(btn)showMega(btn.dataset.key)});
  mega.addEventListener('pointerenter',cancelClose);
  mega.addEventListener('pointerleave',e=>{if(rail.contains(e.relatedTarget))return;clearTimeout(closeTimer);if(lockedKey&&shownKey!==lockedKey){closeTimer=setTimeout(()=>showMega(lockedKey),220)}else if(!lockedKey){hideMega(false)}});
  pin.addEventListener('click',e=>{e.stopPropagation();if(shownKey)toggleLock(shownKey)});
  document.addEventListener('pointerdown',e=>{if(rail.contains(e.target)||mega.contains(e.target))return;lockedKey='';hideMega(true)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){lockedKey='';hideMega(true)}});

  /* Header menu opens current domain; it never changes content width. */
  window.toggleSidebar=function(force){
    const key=currentDomain();
    if(force===false){lockedKey='';hideMega(true);return}
    if(mega.classList.contains('open')&&shownKey===key){lockedKey='';hideMega(true)}else{lockedKey=key;showMega(key)}
  };

  /* Keep active primary domain synchronized after every page navigation. */
  const originalOpenPage=window.openPage;
  if(typeof originalOpenPage==='function'){
    window.openPage=function(id,push=true){trackRecent(id);const result=originalOpenPage(id,push);setTimeout(syncRail,0);return result};
  }

  buildRail();
  document.documentElement.style.setProperty('--sidebar-current','80px');
  const app=document.getElementById('appShell')||document.querySelector('.app');if(app)app.classList.add('navCollapsed');
  syncRail();
})();
</script>
